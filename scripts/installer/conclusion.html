<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.65 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; margin: 0; padding: 2px 4px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
  h2 { font-size: 13px; font-weight: 600; margin: 14px 0 2px; }
  p { margin: 0 0 6px; }
  .note { color: #86868b; font-size: 12px; }
</style>
</head>
<body>
<h1>Conch 装好了</h1>
<h2>打开 Conch</h2>
<p>在程序坞里点“App”（macOS 15 及以前叫“启动台”），或者打开“应用程序”文件夹，都能找到 Conch；也可以按 ⌘ 空格，输入“Conch”。</p>
<h2>第一次使用</h2>
<p>连接局域网里的设备时，系统会问是否允许 Conch 访问本地网络，选“允许”。</p>
<h2>升级和卸载</h2>
<p>以后有新版本，直接安装新的安装包就会覆盖升级，会话和设置都会保留。</p>
<p class="note">卸载：把“应用程序”里的 Conch 拖到废纸篓。会话列表留在 ~/Library/Application Support/Conch，重新安装后还能接着用；不需要了可以一起删掉。</p>
</body>
</html>
