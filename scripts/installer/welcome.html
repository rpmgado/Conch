<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.65 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; margin: 0; padding: 2px 4px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: #86868b; margin: 0 0 14px; }
  ul { padding-left: 20px; margin: 6px 0 14px; }
  li { margin: 3px 0; }
  .note { color: #86868b; font-size: 12px; }
</style>
</head>
<body>
<h1>欢迎使用 Conch</h1>
<p class="sub">版本 @VERSION@ · Mac 原生的 SSH 终端</p>
<p>Conch 用来连接和管理服务器、交换机和路由器：</p>
<ul>
  <li>SSH、Telnet 和串口连接；会话按分组管理，能从 ~/.ssh/config 和 Xshell 导入</li>
  <li>标签页和分屏，一次操作多台服务器</li>
  <li>SFTP 文件面板、服务器监控、端口转发、rz/sz 传文件</li>
  <li>玻璃、石墨、环境色三套外观，生产环境的会话一眼就能认出来</li>
</ul>
<p>点“继续”后，Conch 会装进“应用程序”文件夹。</p>
<p class="note">需要 macOS @MIN_MACOS_NAME@ 或更新的系统，搭载 Apple 芯片的 Mac。</p>
</body>
</html>
