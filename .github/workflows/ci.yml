name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conch-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    # Official Apple-silicon image with the matching macOS 27.2 SDK.
    # See docs/RELEASING.md for the runner/toolchain baseline.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Verify toolchains
        run: |
          rustc --version | grep '^rustc 1.99.1 '
          xcodebuild -version
          swift --version
      - name: Clean checkout build and regression tests
        run: scripts/ci.sh
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conch-ci-logs
          path: build/ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
